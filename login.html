<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- viewer spline -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.32/build/spline-viewer.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
      height: 100vh;
      font-size: 16px;
      /* Base size for em calculations */
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Left Side */
    .left {
      width: 50%;
      background-color: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      padding: 1.25em;
    }

    /* Logo Left */
    .logo-left {
      position: absolute;
      top: 2.5em;
      left: 2.5em;
      width: 6.25em;
      z-index: 100;
    }

    /* Form Container */
    .form-wrapper {
      width: 100%;
      max-width: 24em;
      padding: 1.25em;
    }

    h1 {
      text-align: center;
      margin-bottom: 2em;
      font-weight: 400;
      font-size: 2.2em;
      letter-spacing: -0.02em;
    }

    .input-group {
      margin-bottom: 1.5em;
    }

    label {
      display: block;
      margin-bottom: 0.6em;
      font-size: 0.95em;
      font-weight: 500;
      color: #fff;
    }

    input {
      width: 100%;
      height: 3.125em;
      background: #a0a0a0;
      border: none;
      border-radius: 0.125em;
      padding: 0 1em;
      font-size: 1em;
      color: #000;
      outline: none;
      transition: background 0.2s;
    }

    input:focus {
      background: #bfbfbf;
    }

    button {
      width: 100%;
      height: 3.125em;
      background: #e6e6e6;
      color: #000;
      border: none;
      border-radius: 1.56em;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
      margin-top: 1.25em;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: #fff;
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Right Side */
    .right {
      width: 50%;
      background-color: #000;
      position: relative;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    /* Starbase Patch */
    .logo-right {
      position: absolute;
      top: 10%;
      width: 11.25em;
      z-index: 20;
      pointer-events: none;
      opacity: 0.9;
    }

    spline-viewer {
      width: 100% !important;
      height: 102% !important;
      transform: scale(0.85) translateY(15%);
    }

    /* Responsive */
    @media (max-width: 968px) {
      .container {
        flex-direction: column;
      }

      .left,
      .right {
        width: 100%;
        height: 50%;
      }

      .right {
        display: none;
      }

      .left {
        height: 100%;
        background: #080808;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Left Panel -->
    <div class="left">
      <!-- SpaceX Logo -->
      <img src="img/logo.png" alt="SpaceX" class="logo-left">

      <div class="form-wrapper">
        <h1>Inicia sesión</h1>
        <form onsubmit="window.location.href='panel.html'; return false;">
          <div class="input-group">
            <label for="user">Usuario</label>
            <input type="text" id="user" required />
          </div>

          <div class="input-group">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" required />
          </div>

          <button type="submit">Ingresar</button>
        </form>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right">
      <!-- Starbase Patch -->
      <img src="img/sbpatch.png" alt="Starbase" class="logo-right">

      <!-- Robot 3D Model -->
      <spline-viewer url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"></spline-viewer>
    </div>
  </div>

</body>

</html>
