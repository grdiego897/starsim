<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Starbase Login</title>

  <!-- viewer spline -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.32/build/spline-viewer.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
      height: 100vh;
    }
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .left {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      z-index: 10;
    }
    .card {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    h1 { text-align: center; margin-bottom: 40px; font-weight: 400; font-size: 2rem; }
    input {
      width: 100%;
      height: 45px;
      background: #a3a3a3;
      border: none;
      border-radius: 4px;
      padding: 0 15px;
      margin-bottom: 20px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      height: 45px;
      background: #e0e0e0;
      color: #000;
      border: none;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: white; }

    /* Right side – robot */
    .right {
      width: 50%;
      position: relative;
    }
    spline-viewer {
      width: 100% !important;
      height: 100% !important;
      transform: scale(1.25) translateY(8%);
    }

    /* SpaceX logo */
    .logo-left {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 120px;
      z-index: 100;
    }

    /* Starbase parche */
    .logo-right {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      z-index: 100;        
      pointer-events: none; 
      opacity: 0.95;
    }

    /* Responsive – esconder robot en pantallas pequeñas */
    @media (max-width: 968px) {
      .container { flex-direction: column; }
      .left, .right { width: 100%; height: 50%; }
      .right { display: none; }
      .logo-right { display: none; }
    }

    
  </style>
</head>
<body>

  <!-- logo spacex -->
  <img src="img/spxlogo.png" alt="SpaceX" class="logo-left">

  <!-- parche starbase centrado -->
  <img src="img/sbpatch.png" alt="Starbase" class="logo-right">

  <div class="container">
    <!-- form login -->
    <div class="left">
      <div class="card">
        <h1>Inicia sesión</h1>
        <form onsubmit="alert('Login exitoso! :)'); return false;">
          <input type="text" placeholder="Usuario" required />
          <input type="password" placeholder="Contraseña" required />
          <button type="submit">Ingresar</button>
        </form>
      </div>
    </div>

    <!-- robot -->
    <div class="right">
      <spline-viewer url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode">
      </spline-viewer>
    </div>
  </div>

</body>
</html>
