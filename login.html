<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starsim</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Runtime de Spline (sin web component) -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
      height: 100vh;
      font-size: 16px;
      /* Tamaño base para cálculos em */
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Lado izquierdo */
    .left {
      width: 50%;
      background-color: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      padding: 1.25em;
    }

    /* Logo izquierdo */
    .logo-left {
      position: absolute;
      top: 2.5em;
      left: 2.5em;
      width: 6.25em;
      z-index: 100;
    }

    /* Contenedor del formulario */
    .form-wrapper {
      width: 100%;
      max-width: 24em;
      padding: 1.25em;
    }

    h1 {
      text-align: center;
      margin-bottom: 2em;
      font-weight: 400;
      font-size: 2.2em;
      letter-spacing: -0.02em;
    }

    .input-group {
      margin-bottom: 1.5em;
    }

    label {
      display: block;
      margin-bottom: 0.6em;
      font-size: 0.95em;
      font-weight: 500;
      color: #fff;
    }

    input {
      width: 100%;
      height: 3.125em;
      background: rgba(160, 160, 160, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.125em;
      padding: 0 1em;
      font-size: 1em;
      color: #fff;
      outline: none;
      transition: background 0.2s;
    }

    input:focus {
      background: #bfbfbf;
    }

    .input-wrapper {
      position: relative;
    }

    .input-error {
      border: 1px solid #ff3b30 !important;
      background: rgba(255, 59, 48, 0.1) !important;
    }

    .error-icon {
      position: absolute;
      right: 1em;
      top: 50%;
      transform: translateY(-50%);
      color: #ff3b30;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }

    .input-error ~ .error-icon {
      opacity: 1;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      25% { transform: translateY(-50%) translateX(-4px); }
      50% { transform: translateY(-50%) translateX(4px); }
      75% { transform: translateY(-50%) translateX(-4px); }
    }

    button {
      width: 100%;
      height: 3.125em;
      background: #e6e6e6;
      color: #000;
      border: none;
      border-radius: 1.56em;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
      margin-top: 1.25em;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: #fff;
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Lado derecho */
    .right {
      width: 50%;
      background-color: #000;
      position: relative;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    /* Parche de Starbase */
    .logo-right {
      position: absolute;
      top: 10%;
      width: 11.25em;
      z-index: 20;
      pointer-events: none;
      opacity: 0.9;
    }

    #canvas3d {
      width: 100% !important;
      height: 102% !important;
      transform: scale(0.85) translateY(15%);
    }

    /* Responsivo */
    @media (max-width: 968px) {
      .container {
        flex-direction: column;
      }

      .left,
      .right {
        width: 100%;
        height: 50%;
      }

      .right {
        display: none;
      }

      .left {
        height: 100%;
        background: #080808;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Panel izquierdo -->
    <div class="left">
      <!-- Logo SpaceX -->
      <img src="img/logo.png" alt="SpaceX" class="logo-left">

      <div class="form-wrapper">
        <h1>Inicia sesión</h1>
        <form onsubmit="handleLogin(event)">
          <div class="input-group">
            <label for="user">Usuario (Email)</label>
            <div class="input-wrapper">
              <input type="email" id="user" required />
              <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
          </div>

          <div class="input-group">
            <label for="pass">Contraseña</label>
            <div class="input-wrapper">
              <input type="password" id="pass" required />
              <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
          </div>

          <button type="submit">Ingresar</button>
        </form>
      </div>
    </div>

    <!-- Panel derecho -->
    <div class="right">
      <!-- Parche de Starbase -->
      <img src="img/sbpatch.png" alt="Starbase" class="logo-right">

      <canvas id="canvas3d"></canvas>

      <script type="module" src="js/cm.js"></script>
      <script>
        async function handleLogin(e) {
          e.preventDefault();
          
          const emailInput = document.getElementById('user');
          const passwordInput = document.getElementById('pass');
          const email = emailInput.value;
          const password = passwordInput.value;
          const btn = e.target.querySelector('button');
          const originalText = btn.innerText;

          try {
            btn.innerText = 'Autenticando...';
            btn.disabled = true;

            const res = await fetch('https://starsim-production-e711.up.railway.app/api/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({ email, password })
            });

            if (res.ok) {
              const data = await res.json();
              localStorage.setItem('api_token', data.token);
              localStorage.setItem('user', JSON.stringify(data.user));
              window.location.href = 'index.html#panel?welcome=1';
            } else {
              const errorData = await res.json();
              
              // Mostrar feedback visual de error
              emailInput.classList.add('input-error');
              passwordInput.classList.add('input-error');
              
              // Limpiar clase de error cuando el usuario vuelva a escribir
              const clearError = () => {
                emailInput.classList.remove('input-error');
                passwordInput.classList.remove('input-error');
                emailInput.removeEventListener('input', clearError);
                passwordInput.removeEventListener('input', clearError);
              };
              
              emailInput.addEventListener('input', clearError);
              passwordInput.addEventListener('input', clearError);
            }
          } catch (err) {
            console.error(err);
            alert('Error de conexión con el servidor. ¿Está el backend encendido?');
          } finally {
            btn.innerText = originalText;
            btn.disabled = false;
          }
        }
      </script>
    </div>

  </div>

</body>

</html>
