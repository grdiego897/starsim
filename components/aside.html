<style>
    .sidebar {
        position: fixed;
    }

    .sidebar {
        width: 250px;
        padding: 30px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-right: 1px solid #111;
        transition: width 0.4s ease;
        position: relative;
        z-index: 100;
    }

    .sidebar.collapsed {
        width: 80px;
        padding: 30px 15px;
    }

    .logo-wrapper {
        cursor: pointer;
        text-align: center;
        margin-bottom: 50px;
    }

    .logo-img {
        width: 120px;
        display: block;
        margin: 0 auto;
    }

    .sidebar.collapsed .logo-img {
        width: 50px;
    }

    .nav-menu {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .nav-menu ul {
        list-style: none;
        padding: 0;
        margin: 0 auto;
        width: 100%;
    }

    .nav-menu li {
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.3s;
        padding-left: 20px;
    }

    .nav-menu li.active,
    .nav-menu li:hover {
        color: var(--text-main);
    }

    .nav-menu li::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: white;
        border-radius: 50%;
        margin-right: 15px;
        flex-shrink: 0;
        opacity: 0.5;
        /* Dim dot by default */
    }

    .nav-menu li.active::before,
    .nav-menu li:hover::before {
        opacity: 1;
    }

    .nav-menu li span {
        transition: opacity 0.2s ease 0.1s;
        white-space: nowrap;
    }

    .sidebar.collapsed .nav-menu li span {
        opacity: 0;
        width: 0;
        overflow: hidden;
    }

    .sidebar.collapsed .nav-menu li {
        justify-content: center;
        padding-left: 0;
    }

    .sidebar.collapsed .nav-menu li::before {
        margin-right: 0;
    }

    .sidebar-bottom-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
    }

    .logo-bottom-container {
        width: 50px;
        height: 50px;
        background: #222;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        cursor: pointer;
        transition: background 0.3s;
    }

    .logo-bottom-container:hover {
        background: #333;
    }

    /* --- GROK POPUP --- */
    .grok-popup {
        position: absolute;
        bottom: 90px;
        left: 20px;
        width: 280px;
        background-color: #1a1a1a;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: all 0.3s ease;
        z-index: 1000;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .grok-popup.active {
        opacity: 1;
        pointer-events: all;
        transform: translateY(0);
    }

    .grok-logo-full {
        width: 100px;
        height: auto;
        object-fit: contain;
    }

    .grok-input-container {
        width: 100%;
        background-color: #333;
        border-radius: 15px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        height: 120px;
        position: relative;
    }

    .grok-input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        color: #ccc;
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        resize: none;
        outline: none;
    }

    .grok-input::placeholder {
        color: #666;
    }

    .grok-send-btn {
        position: absolute;
        bottom: 10px;
        right: 10px;
        width: 24px;
        height: 24px;
        background-color: #ccc;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: none;
        transition: transform 0.2s, background-color 0.2s;
    }

    .grok-send-btn:hover {
        transform: scale(1.1);
        background-color: #fff;
    }

    .grok-send-icon {
        width: 12px;
        height: 12px;
    }
</style>
<aside class="sidebar" id="sidebar">
    <div>
        <div class="logo-wrapper" id="toggleSidebar">
            <img src="img/logo.png" alt="SpaceX Logo" class="logo-img">
        </div>

        <nav class="nav-menu">
            <ul>
                <li onclick="window.location.href='panel.html'" data-text="Panel"><span>Panel</span></li>
                <li onclick="window.location.href='program.html'" data-text="Programa"><span>Programa</span></li>
                <li onclick="window.location.href='mision.html'" data-text="Mision"><span>Nueva Misión</span></li>
            </ul>
        </nav>
    </div>

    <div class="logo-bottom-container" id="grokTrigger">
        <img src="img/grok.png" alt="Grok" class="sidebar-bottom-icon">
    </div>

    <!-- Grok Popup -->
    <div class="grok-popup" id="grokPopup">
        <img src="img/grok-full.png" alt="Grok" class="grok-logo-full">

        <form class="grok-input-container" id="grokSearchForm">

            <textarea class="grok-input" name="user_message" placeholder="¿Qué quieres saber?" required></textarea>

            <button type="submit" class="grok-send-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" class="grok-send-icon">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </form>
    </div>
</aside>
