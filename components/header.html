<style>
    /* Header Layout */
    header {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }

    /* Notification Pill */
    .notification-pill {
        background-color: #333;
        padding: 8px 30px;
        border-radius: 20px;
        font-size: 0.9rem;
        color: #ccc;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
    }

    /* Animation Classes */
    .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
        opacity: 1;
        pointer-events: auto;
    }

    .fade-out {
        animation: fadeOut 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
        0% {
            opacity: 0;
            transform: translate(-50%, -20px);
        }

        100% {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    }

    @keyframes fadeOut {
        0% {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        100% {
            opacity: 0;
            transform: translate(-50%, -20px);
            pointer-events: none;
        }
    }

    /* User Profile */
    .user-profile {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .user-name {
        font-weight: 600;
        color: var(--text-main);
    }

    .crown-icon-img {
        width: 16px;
        height: auto;
    }

    .avatar-img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #555;
    }
</style>

<header>
    <div></div> <!-- Spacer for flex alignment -->

    <div id="notificationPill" class="notification-pill">
        Bienvenido
    </div>

    <div class="user-profile">
        <span class="user-name">Gallardo</span>
        <img src="img/ic/crownic.png" alt="Crown" class="crown-icon-img">
        <img src="img/avatar.jpg" alt="User" class="avatar-img">
    </div>
</header>
