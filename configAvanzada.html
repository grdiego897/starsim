<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Avanzada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/configAvanzada.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <script src="js/main.js" defer></script>
    <script src="js/header.js" defer></script>
    <script src="js/configAvanzada.js" defer></script>

    <main class="main-content">
        <div id="header-container"></div>
        <section class="description-panel">
            <h2 class="panel-title">Descripción</h2>
            <div class="desc-grid">
                <div class="desc-col">
                    <label>Objetivos principales</label>
                    <textarea id="objectives-main" class="styled-textarea"></textarea>
                </div>
                <div class="desc-col">
                    <label>Objetivos secundarios</label>
                    <textarea id="objectives-secondary" class="styled-textarea"></textarea>
                </div>
                <div class="desc-inputs">
                    <div class="input-group">
                        <label>Duración</label>
                        <input type="text" id="duration-input" class="styled-input" placeholder="MM/DD/HH/mm">
                    </div>
                    <div class="input-group">
                        <label>Tripulación</label>
                        <input type="number" id="crew-input" class="styled-input small-input" value="0" min="0">
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom Section -->
        <section class="bottom-section">
            <!-- Vehicle Image -->
            <div class="vehicle-container">
                <img id="vehicle-blueprint" src="" alt="Vehicle Blueprint">
            </div>

            <!-- Cargo Bay -->
            <div class="cargo-bay-panel">
                <div class="cargo-list-wrapper">
                    <ul id="cargo-list">
                        <!-- Items will be populated by JS or static initial data -->
                    </ul>
                </div>

                <div class="vertical-divider"></div>

                <div class="cargo-controls">
                    <h3>Bahía de carga</h3>
                    <button id="add-cargo-btn" class="add-btn">+</button>
                    <div class="cargo-stats">
                        <p>Objetos: <span id="total-objects">0</span></p>
                        <p>Masa: <span id="total-mass">0 kg</span></p>
                    </div>
                </div>
            </div>
        </section>

        <div class="footer-actions">
            <!-- Reusing btn-advanced style potentially or defining new one -->
            <button class="btn-back" onclick="window.location.href='mision.html'">VOLVER</button>
        </div>
    </main>
</body>

</html>
