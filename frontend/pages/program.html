<div class="program-container">
    <div class="program-card">
        <div class="card-header">
            <h2>Programa</h2>
            <div class="filter-wrapper">
                <select id="launcher-filter" class="status-filter-select">
                    <option value="all">Lanzador</option>
                    <option value="Starship">Starship</option>
                    <option value="Falcon 9">Falcon 9</option>
                    <option value="Falcon Heavy">Falcon Heavy</option>
                </select>
                <select id="entity-filter" class="status-filter-select">
                    <option value="all">Entidad</option>
                </select>
                <select id="program-filter" class="status-filter-select">
                    <option value="all">Programa</option>
                </select>
                <select id="status-filter" class="status-filter-select">
                    <option value="all">Estado</option>
                    <option value="programado">Programado</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="hold">Hold</option>
                    <option value="cancelado">Cancelado</option>
                    <option value="lanzado">Lanzado</option>
                </select>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="program-table">
                <thead>
                    <tr>
                        <th>MISIÓN</th>
                        <th>ENTIDAD</th>
                        <th>PROGRAMA</th>
                        <th>FECHA</th>
                        <th>ESTADO</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="mission-table-body">
                    <!-- Contenido dinámico -->
                </tbody>
            </table>
        </div>
    </div>
</div>
