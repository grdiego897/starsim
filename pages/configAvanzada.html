<section class="description-panel">
    <div class="panel-header" style="display: flex; justify-content: center; position: relative; margin-bottom: 15px; align-items: center;">
        <h2 class="panel-title" style="margin-bottom: 0;">Descripción</h2>
        <div class="input-group" style="position: absolute; right: 0; display: flex; flex-direction: row; align-items: center; gap: 10px;">
            <label style="font-weight: 700; font-size: 0.9rem; margin: 0;">Tripulación</label>
            <input type="number" id="crew-input" class="styled-input small-input" value="0" min="0">
        </div>
    </div>
    <div class="desc-grid">
        <div class="desc-col">
            <label>Objetivos principales</label>
            <textarea id="objectives-main" class="styled-textarea" spellcheck="false"></textarea>
        </div>
        <div class="desc-col">
            <label>Objetivos secundarios</label>
            <textarea id="objectives-secondary" class="styled-textarea" spellcheck="false"></textarea>
        </div>
    </div>
</section>

<!-- Sección inferior -->
<section class="bottom-section">
    <!-- Imagen del vehículo -->
    <div class="vehicle-container">
        <img id="vehicle-blueprint" src="" alt="Vehicle Blueprint">
    </div>

    <!-- Bahía de carga -->
    <div class="cargo-bay-panel">
        <div class="cargo-list-wrapper">
            <ul id="cargo-list">
                <!-- Items serán poblados por JS o datos estáticos -->
            </ul>
        </div>

        <div class="vertical-divider"></div>

        <div class="cargo-controls">
            <h3>Bahía de carga</h3>
            <button id="add-cargo-btn" class="add-btn">+</button>
            <div class="cargo-stats">
                <p>Objetos: <span id="total-objects">0</span></p>
                <p>Masa: <span id="total-mass">0 t</span></p>
            </div>
        </div>
    </div>
</section>

<div class="footer-actions">
    <!-- Reutilizando estilo btn-advanced o definiendo nuevo -->
    <button class="btn-back" onclick="window.router.navigateTo('mision')">VOLVER</button>
</div>
