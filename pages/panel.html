<div class="dashboard-container">
    <section class="dashboard-grid">
        <div class="card-wrapper" id="card-launches">
            <div class="card">
                <div class="card-icon">
                    <img src="img/ic/starshipic.png" alt="Launch" class="card-icon-img">
                </div>
                <div class="card-info">
                    <span class="card-label">Lanzamientos<br>pendientes</span>
                    <span class="card-value" id="pending-missions-count">0</span>
                </div>
            </div>
            <div class="card-graph-tooltip">
                <canvas id="chart-launches"></canvas>
            </div>
        </div>

        <div class="card-wrapper" id="card-pads">
            <div class="card">
                <div class="card-icon">
                    <img src="img/ic/padic.png" alt="Pads" class="card-icon-img">
                </div>
                <div class="card-info">
                    <span class="card-label">Pads</span>
                    <span class="card-value">2/4</span>
                </div>
            </div>
            <div class="card-graph-tooltip">
                <canvas id="chart-pads"></canvas>
            </div>
        </div>

        <div class="card-wrapper" id="card-success">
            <div class="card">
                <div class="card-icon">
                    <img src="img/ic/successic.png" alt="Stats" class="card-icon-img">
                </div>
                <div class="card-info">
                    <span class="card-label">Tasa de Éxito</span>
                    <span class="card-value">98%</span>
                </div>
            </div>
            <div class="card-graph-tooltip">
                <canvas id="chart-success"></canvas>
            </div>
        </div>
    </section>

    <section class="middle-section">
        <div class="countdown-card">
            <div class="mission-title" id="countdown-info">
                <h3>Misión<br><span id="countdown-mission-name">—</span></h3>
            </div>
            <div class="timer" id="countdown-timer">
                <div class="time-unit"><span id="cd-days">0</span><label>DÍAS</label></div>
                <div class="time-unit"><span id="cd-hours">0</span><label>HORAS</label></div>
                <div class="time-unit"><span id="cd-mins">0</span><label>MIN</label></div>
                <div class="time-unit"><span id="cd-secs">0</span><label>SEG</label></div>
            </div>
            <div id="countdown-empty"
                style="display:none; text-align:center; width:100%; color:#888; font-size:0.95rem;">
                Sin misiones próximas programadas
            </div>
        </div>

        <div class="weather-card">
            <div class="weather-info">
                <h3 id="weather-title">Pronóstico</h3>
                <div class="weather-grid">
                    <span>Temp:</span> <span id="weather-temp">-- °C</span>
                    <span>Viento:</span> <span id="weather-wind">-- km/h</span>
                    <span>Precipitación:</span> <span id="weather-precip">-- mm</span>
                    <span>Viabilidad:</span> <span id="weather-viability" class="viability-badge">--</span>
                </div>
            </div>
            <div class="weather-icon-wrapper" style="text-align: right;">
                <div id="weather-port" style="font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; font-weight: 500;">--</div>
                <img src="img/ic/sunic.png" alt="Sunny" id="weather-icon" class="weather-icon-img">
            </div>
        </div>
    </section>

    <section class="program-section">
        <div class="program-header">
            <h3>Programa próximo</h3>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>MISIÓN</th>
                        <th>ENTIDAD</th>
                        <th>FECHA</th>
                        <th>ESTADO</th>
                        <th class="actions-cell">ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="upcoming-missions-list">
                    <!-- Dynamic Content -->
                </tbody>
            </table>
        </div>
    </section>
</div>
